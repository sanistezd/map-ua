packages:
  - apps/*
  - packages/*

confirmModulesPurge: false

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

overrides:
  '@parcel/watcher': 2.5.6
  enhanced-resolve: 5.18.3
